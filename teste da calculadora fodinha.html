<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Teste de Componentes - Calculadora</title>
</head>
<body>

    <h2>Calculadora (Componente)</h2>
    <input id="number1" type="number" placeholder="0">
    <input id="number2" type="number" placeholder="0">
    <br><br>
    <button id="btn-soma" onclick="executarAcao('soma')">Somar</button>
    <button id="btn-dividir" onclick="executarAcao('divisao')">Dividir</button>
    <button id="btn-menos" onclick="executarAcao('menos')">menos</button>
    <button id="btn-multiplicar" onclick="executarAcao('multiplicar')">multiplicar</button>

    <div id="visor">Aguardando operação...</div>

    <div class="caixa-teste">
        <h3>Painel de Teste de Componente</h3>
        <button onclick="rodarTestes()">Rodar Testes de Componente</button>
        <div id="log" class="log-teste"></div>
    </div>

    <script>
        function executarAcao(operacao) {
            const n1 = Number(document.getElementById("number1").value);
            const n2 = Number(document.getElementById("number2").value);
            let resultado;

            if (operacao === 'soma') resultado = n1 + n2;
            if (operacao === 'divisao') {
                resultado = n2 === 0 ? "Erro: Div/0" : n1 / n2;
            };
            if (operacao === 'menos') {
                resultado = (n1 - n2)
            }
            if (operacao === 'multiplicar') {
                resultado = (n1 * n2)
            }
            document.getElementById("visor").innerText = resultado;
        }

        function rodarTestes() {
            const log = document.getElementById("log");
            log.innerHTML = "Iniciando testes...<br>";

            const input1 = document.getElementById("number1");
            const input2 = document.getElementById("number2");
            const btnSoma = document.getElementById("btn-soma");
            const visor = document.getElementById("visor");

            input1.value = '10';
            input2.value = '20';
            btnSoma.click(); 

            if (visor.innerText === '30') {
                log.innerHTML += "<span class='passou'>[PASSOU]</span> Teste de Interface: Soma igual a 30.<br>";
            } else {
                log.innerHTML += "<span class='falhou'>[FALHOU]</span> Teste de Interface: Soma falhou.<br>";
            }

            const btnDiv = document.getElementById("btn-dividir");
            input1.value = "5";
            input2.value = "0";
            btnDiv.click();

            if (visor.innerText === "Erro: Div/0") {
                log.innerHTML += "<span class='passou'>[PASSOU]</span> Teste de Interface: Mensagem de erro de divisão por zero exibida.<br>";
            } else {
                log.innerHTML += "<span class='falhou'>[FALHOU]</span> Teste de Interface: Erro de divisão não tratado visualmente.<br>";
            }
            const btnmultip = document.getElementById("btn-multiplicar");
            input1.value = "10";
            input2.value = "3";
            btnmultip.click();
          if (visor.innerText === "30"){
            log.innerHTML += "<span class='passou'>[PASSOU]</span> teste de interface: multiplicação de 3x10 é igual a 30.<br>";
          }  else {
            log.innerHTML += "<span class='falhou'>[FALHOU]</span> teste de interface: erro de multiplicação.<br>"

            }
            const btnmenos = document.getElementById("btn-menos");
            input1.value="10"
            input2.value="7"
            btnmenos.click();
        if (visor.innerText === "3"){
            log.innerHTML += "<span class='passou'>[PASSOU]</span> teste de interface: 10-7 é igual a 3.<br>"
        } else {
            log.innerHTML += "<span class='falhou'>[FALHOU]</span> teste de interface: erro de diminuição.<br>"
        }
        log.innerHTML += "<h4>Iniciando testes de complemento</h4>"
        const original = 50
        input1.value = original
        input2.value ="10"
        document.getElementById("btn-soma").click() 
        const resultadosoma = visor.innerText
        input1.value = resultadosoma
        input2.value = "10";
        document.getElementById("btn-menos").click()
        if(visor.innerText ==original){
            log.innerHTML += "<span class='passou'>[passou]</span> Complemento: subtracao anulou a Soma 50+10-10=50<br>";
          }  else{
                log.innerHTML += "<span class='falhou'>[nao passou]</span> Complemento: subtracao não anulou a Soma 50+10=60<br>";
          } const original2 =50;
            const div= 10;
            input1.value = original2
            input2.value = div
            document.getElementById("btn-dividir").click()
            input1.value = visor.innerText; 
            input2.value = div;
            document.getElementById("btn-multiplicar").click();
            if(visor.innerText == original2){
                log.innerHTML += "<span class='passou'>[passou]</span> Complemento: a multiplicacao anulou a divisao (50/10)*10=50<br>";
            }else{
                log.innerHTML += "<span class='falhou'>[nao passou]</span> Complemento: a multiplicacao nao anlou a divisao 50/10=5<br>";


            }const original3 =50;
            const menos= 20
            input1.value = original3
            input2.value = menos
            document.getElementById("btn-menos").click()
            input1.value = visor.innerText
            input2.value = menos
            document.getElementById("btn-soma").click()
            if(visor.innerText == original3){
                log.innerHTML += "<span class='passou'>[passou]</span> Complemento: a soma anulou a subtracao 50-20+20=50<br>";
            }else{
                log.innerHTML += "<span class='falhou'>[nao passou]</span> Complemento: a soma nao anulou a subtracao 50-20=30<br>";
            }const original4 =50
            const multip=5
            input1.value = original4
            input2.value = multip
            document.getElementById("btn-multiplicar").click()
            input1.value = visor.innerText
            input2.value = multip
            document.getElementById("btn-dividir").click()
            if(visor.innerText == original4){
                log.innerHTML += "<span class='passou'>[passou]</span> Complemento: a divisao anulou a multiplicacao (50*5)/5=50<br>";
            }else{
                log.innerHTML += "<span class='falhou'>[nao passou]</span> Complemento: a divisao nao anulou a multiplicacao 50*5<br>";
            }
        }
    </script>
</body>
</html>
