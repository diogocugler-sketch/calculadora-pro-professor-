<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
<body>
  
    <input id="number1" type="number">
    <input id= "number2" type="number">
    <button id="meuBotao" onclick="calcular('soma')">somar</button>
    <button id="meuBotao" onclick="calcular('diminuir')">diminuir</button>
    <button id="meuBotao" onclick="calcular('dividir')">dividir</button>
    <button id="meuBotao" onclick="calcular('multiplicar')">multiplicar</button>
    <div id="resultado">O resultado aparecerá aqui</div>


    <script>
         function calcular(operacoes) {
            const  numero1 = Number(document.getElementById("number1").value)
            const  numero2 = Number(document.getElementById("number2").value)
            
            let resultado 

            if 
                (operacoes === 'soma') {
                resultado = (numero1 + numero2)
            }

            else if
                (operacoes === 'diminuir') {
                resultado = (numero1 - numero2)
            }
            else if
                (operacoes === 'dividir') {
                resultado = (numero1 / numero2)
            }
            else if
                (operacoes === 'multiplicar') {
                resultado = (numero1 * numero2)
            }
            document.getElementById("resultado").innerHTML = resultado;
         }
    </script>
  
</body>
</head>
</html>
